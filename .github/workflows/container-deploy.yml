name: Container Build And Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fantastik-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_test.py
      - name: Install browser for UI checks
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Check desktop and mobile UI
        if: runner.os == 'Linux'
        run: python scripts/check_ui.py
      - run: python -m bandit -r main.py helper scrap scripts/smoke_test.py -ll
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip

  build-and-push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=Fantastik
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_IMAGE: ${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test built image without network
        run: |
          docker pull "$RELEASE_IMAGE"
          docker run --rm --network none --memory 512m --pids-limit 128 --security-opt no-new-privileges:true \
            "$RELEASE_IMAGE" python scripts/smoke_test.py
      - name: Scan OS and application packages
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$RELEASE_IMAGE"

  deploy:
    needs: [build-and-push, scan-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
      DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
      DEPLOY_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
      DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      REGISTRY_USER: ${{ secrets.GHCR_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
      RELEASE_IMAGE: ${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}
      EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate configuration and prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH/" != *"/../"* ]]
          [[ "$RELEASE_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host fantastik-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
      - name: Upload deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          ssh fantastik-target "mkdir -p -- '$DEPLOY_PATH'"
          scp docker-compose.yml .env.example scripts/deploy.sh "fantastik-target:$DEPLOY_PATH/"
      - name: Log in to private registry
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$REGISTRY_TOKEN" ]; then
            [[ "$REGISTRY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
            printf '%s\n' "$REGISTRY_TOKEN" | ssh fantastik-target "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          fi
      - name: Deploy exact image with verification and rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh fantastik-target "bash '$DEPLOY_PATH/deploy.sh' '$DEPLOY_PATH' '$RELEASE_IMAGE' '$EXPECTED_REVISION'"
