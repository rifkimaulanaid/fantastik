services:
  fantastik:
    build:
      context: .
      dockerfile: Dockerfile

    image: ${APP_IMAGE:-${IMAGE_NAME:-fantastik}:${IMAGE_TAG:-latest}}
    container_name: ${CONTAINER_NAME:-fantastik}
    hostname: fantastik
    restart: unless-stopped
    read_only: true
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - fantastik_data:/app/data

    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"

    environment:
      TZ: ${TZ:-Asia/Makassar}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    networks:
      fantastik_net:
        aliases:
          - fantastik

networks:
  fantastik_net:
    name: fantastik_net

volumes:
  fantastik_data:
